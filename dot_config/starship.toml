"$schema" = "https://starship.rs/config-schema.json"

palette = "bright_amber"
add_newline = false
command_timeout = 1000

# Context stays on the first line. The character starts a clean input line.
format = """
$username\
$hostname\
$shlvl\
$container\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Project runtimes and the clock stay out of the command input area.
right_format = "$nodejs$golang$python$rust$time"

[palettes.bright_amber]
path = "#f59e0b"
git = "#fb923c"
runtime = "#fbbf24"
duration = "#facc15"
muted = "#939594"
text = "#1a1a1a"
success = "#f59e0b"
error = "#ff5f56"

[character]
success_symbol = "[❯](bold success)"
error_symbol = "[✗](bold error)"

[custom.transient_success]
when = true
symbol = "❯"
style = "success"
format = "[$symbol]($style) "

[custom.transient_error]
when = true
symbol = "❯"
style = "error"
format = "[$symbol]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " "
read_only_style = "bold text"
format = "[](fg:black bg:path)[ $path$read_only ](bold fg:text bg:path)[](fg:path) "

[git_branch]
symbol = "🌿 "
style = "bold git"
format = "[$symbol$branch]($style) "

[git_state]
style = "bold git"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_status]
style = "bold git"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "×${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "−${count} "

[cmd_duration]
min_time = 2000
style = "bold duration"
format = "[󱎫 $duration]($style) "

[nodejs]
symbol = " "
style = "bold runtime"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold runtime"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold runtime"
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[rust]
symbol = " "
style = "bold runtime"
format = "[$symbol($version )]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"

# Identity is visible only when it changes the execution context.
[username]
show_always = false
style_user = "bold duration"
style_root = "bold error"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold duration"
format = "[@$hostname]($style) "

[shlvl]
disabled = false
threshold = 2
symbol = "↳"
style = "bold duration"
format = "[$symbol$shlvl]($style) "

[container]
style = "bold duration"
format = "[$symbol$name]($style) "

# These contexts are intentionally excluded from the prompt.
[aws]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[mise]
disabled = true

[package]
disabled = true
